name: Android APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.3
  GODOT_TAG: 4.6.3-stable
  APK_NAME: Connex-v0.3.7.apk
  EXPECTED_RELEASE_CERT_SHA256: BF:CD:2B:59:70:91:E4:AA:FE:4F:27:93:FD:14:A7:9A:2A:D4:94:0D:D1:06:9D:18:74:9C:E7:A9:99:50:D4:22

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.1" "platforms;android-35"

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          mkdir -p /tmp/godot /tmp/godot-templates
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          chmod +x "$GODOT_BIN"
          sudo install -m 0755 "$GODOT_BIN" /usr/local/bin/godot
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          godot --version
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

      - name: Configure Android debug export
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Connex,C=CA"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          EOF

      - name: Prepare permanent release signing key
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        shell: bash
        env:
          CONNEX_KEYSTORE_B64: ${{ secrets.CONNEX_KEYSTORE_B64 }}
          CONNEX_KEYSTORE_PASSWORD: ${{ secrets.CONNEX_KEYSTORE_PASSWORD }}
          CONNEX_KEY_ALIAS: ${{ secrets.CONNEX_KEY_ALIAS }}
          CONNEX_KEY_PASSWORD: ${{ secrets.CONNEX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in CONNEX_KEYSTORE_B64 CONNEX_KEYSTORE_PASSWORD CONNEX_KEY_ALIAS CONNEX_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${secret_name}"
              exit 1
            fi
          done
          if [[ "$CONNEX_KEYSTORE_PASSWORD" != "$CONNEX_KEY_PASSWORD" ]]; then
            echo "::error::Godot Android export requires the keystore and key passwords to match."
            exit 1
          fi
          printf '%s' "$CONNEX_KEYSTORE_B64" | base64 --decode > /tmp/connex-release.keystore
          chmod 600 /tmp/connex-release.keystore
          keytool -list -keystore /tmp/connex-release.keystore -storepass "$CONNEX_KEYSTORE_PASSWORD" -alias "$CONNEX_KEY_ALIAS" >/dev/null
          CERT_SHA256="$(keytool -list -v -keystore /tmp/connex-release.keystore -storepass "$CONNEX_KEYSTORE_PASSWORD" -alias "$CONNEX_KEY_ALIAS" | awk '/SHA256:/{print $2; exit}')"
          if [[ "$CERT_SHA256" != "$EXPECTED_RELEASE_CERT_SHA256" ]]; then
            echo "::error::Release signing certificate mismatch. Expected $EXPECTED_RELEASE_CERT_SHA256 but got $CERT_SHA256"
            exit 1
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/connex-release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$CONNEX_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$CONNEX_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Parse project and smoke-test main scene
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot-editor.log
          if grep -Eq "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-editor.log; then exit 1; fi
          godot --headless --path . --quit-after 2 2>&1 | tee /tmp/godot-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-smoke.log; then exit 1; fi

      - name: Export Android APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          if [[ "${{ github.event_name }}" == "push" && "${{ contains(github.event.head_commit.message, '[release]') }}" == "true" ]]; then
            godot --headless --path . --export-release "Android" "build/${APK_NAME}"
          else
            godot --headless --path . --export-debug "Android" "build/${APK_NAME}"
          fi
          test -s "build/${APK_NAME}"
          sha256sum "build/${APK_NAME}" > "build/${APK_NAME}.sha256"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.1/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "build/${APK_NAME}" | tee "build/${APK_NAME}.signing.txt"
          if [[ "${{ github.event_name }}" == "push" && "${{ contains(github.event.head_commit.message, '[release]') }}" == "true" ]]; then
            grep -F "Signer #1 certificate SHA-256 digest: $(echo "$EXPECTED_RELEASE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')" "build/${APK_NAME}.signing.txt"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Connex-Android-v0.3.7
          path: |
            build/${{ env.APK_NAME }}
            build/${{ env.APK_NAME }}.sha256
            build/${{ env.APK_NAME }}.signing.txt
          if-no-files-found: error

      - name: Publish GitHub Release v0.3.7
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.7
          name: Connex Lab v0.3.7
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            build/${{ env.APK_NAME }}
            build/${{ env.APK_NAME }}.sha256
