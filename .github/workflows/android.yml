name: Android APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.3
  GODOT_TAG: 4.6.3-stable
  APP_VERSION: 0.5.10
  APP_VERSION_CODE: 34
  APK_NAME: Connex-v0.5.10.apk
  ARTIFACT_NAME: Connex-Android-v0.5.10
  EXPECTED_RELEASE_CERT_SHA256: BF:CD:2B:59:70:91:E4:AA:FE:4F:27:93:FD:14:A7:9A:2A:D4:94:0D:D1:06:9D:18:74:9C:E7:A9:99:50:D4:22

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify version, package and signing metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'res://scripts/main_v065.gd' Main.tscn
          grep -F 'const VERSION_065 := "0.5.10"' scripts/main_v065.gd
          grep -F 'boot_splash/show_image=false' project.godot
          grep -F 'export_path="build/Connex-v0.5.10.apk"' export_presets.cfg
          grep -F 'version/code=34' export_presets.cfg
          grep -F 'version/name="0.5.10"' export_presets.cfg
          grep -F 'package/unique_name="com.pixel375.connex"' export_presets.cfg
          grep -F "\`$EXPECTED_RELEASE_CERT_SHA256\`" SIGNING.md

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.1" "platforms;android-35"

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          mkdir -p /tmp/godot /tmp/godot-templates
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          chmod +x "$GODOT_BIN"
          sudo install -m 0755 "$GODOT_BIN" /usr/local/bin/godot
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          godot --version
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

      - name: Configure Android debug export
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Connex,C=CA"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          EOF

      - name: Prepare permanent release signing key
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        shell: bash
        env:
          CONNEX_KEYSTORE_B64: ${{ secrets.CONNEX_KEYSTORE_B64 }}
          CONNEX_KEYSTORE_PASSWORD: ${{ secrets.CONNEX_KEYSTORE_PASSWORD }}
          CONNEX_KEY_ALIAS: ${{ secrets.CONNEX_KEY_ALIAS }}
          CONNEX_KEY_PASSWORD: ${{ secrets.CONNEX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in CONNEX_KEYSTORE_B64 CONNEX_KEYSTORE_PASSWORD CONNEX_KEY_ALIAS CONNEX_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${secret_name}"
              exit 1
            fi
          done
          if [[ "$CONNEX_KEYSTORE_PASSWORD" != "$CONNEX_KEY_PASSWORD" ]]; then
            echo "::error::Godot Android export requires the keystore and key passwords to match."
            exit 1
          fi
          printf '%s' "$CONNEX_KEYSTORE_B64" | base64 --decode > /tmp/connex-release.keystore
          chmod 600 /tmp/connex-release.keystore
          keytool -list -keystore /tmp/connex-release.keystore -storepass "$CONNEX_KEYSTORE_PASSWORD" -alias "$CONNEX_KEY_ALIAS" >/dev/null
          CERT_SHA256="$(keytool -list -v -keystore /tmp/connex-release.keystore -storepass "$CONNEX_KEYSTORE_PASSWORD" -alias "$CONNEX_KEY_ALIAS" | awk '/SHA256:/{print $2; exit}')"
          if [[ "$CERT_SHA256" != "$EXPECTED_RELEASE_CERT_SHA256" ]]; then
            echo "::error::Release signing certificate mismatch. Expected $EXPECTED_RELEASE_CERT_SHA256 but got $CERT_SHA256"
            exit 1
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/connex-release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$CONNEX_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$CONNEX_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Prepare descendant-runtime smoke tests
        shell: bash
        run: |
          set -euo pipefail
          sed -Ei 's/main_v(055|057|058|060|061|062|063|064)\.gd/main_v065.gd/g' tests/editor_chunk2_smoke_v050.gd tests/editor_correctness_smoke_v051.gd || true
          sed -i 's/ends_with("main_v054.gd")/ends_with("main_v065.gd")/' tests/editor_reliability_smoke_v052.gd || true
          sed -i 's/ends_with("main_v056.gd")/ends_with("main_v065.gd")/' tests/editor_touch_attach_smoke_v053.gd || true
          sed -i 's/ends_with("main_v057.gd")/ends_with("main_v065.gd")/' tests/editor_touch_attach_smoke_v053.gd || true
          sed -i 's/ends_with("main_v058.gd")/ends_with("main_v065.gd")/' tests/editor_autoattach_selection_smoke_v054.gd || true
          sed -i 's/ends_with("main_v061.gd")/ends_with("main_v065.gd")/' tests/editor_autodock_camera_smoke_v056.gd || true
          sed -i 's/ends_with("main_v062.gd")/ends_with("main_v065.gd")/' tests/rod_far_end_autoattach_smoke_v057.gd || true
          sed -i 's/ends_with("main_v063.gd")/ends_with("main_v065.gd")/' tests/socket_loop_simulation_smoke_v058.gd || true
          sed -i 's/ends_with("main_v064.gd")/ends_with("main_v065.gd")/' tests/camera_gesture_smoke_v059.gd || true
          sed -i 's/ends_with("main_v064.gd")/ends_with("main_v065.gd")/' tests/physics_stability_smoke_v059.gd || true

      - name: Parse project and smoke-test main scene
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot-editor.log
          if grep -Eq "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-editor.log; then exit 1; fi
          godot --headless --path . --quit-after 2 2>&1 | tee /tmp/godot-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-smoke.log; then exit 1; fi

      - name: Run v0.3.8 behavioral audit smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/audit_smoke_v038.gd 2>&1 | tee /tmp/audit-smoke.log
          grep -F 'AUDIT_SMOKE_OK' /tmp/audit-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|AUDIT_SMOKE_FAIL" /tmp/audit-smoke.log; then exit 1; fi

      - name: Run v0.3.9 deselect and O-Ring smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/selection_smoke_v039.gd 2>&1 | tee /tmp/selection-smoke.log
          grep -F 'SELECTION_SMOKE_OK' /tmp/selection-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|SELECTION_SMOKE_FAIL" /tmp/selection-smoke.log; then exit 1; fi

      - name: Run v0.3.10 interaction smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/interaction_smoke_v040.gd 2>&1 | tee /tmp/interaction-smoke.log
          grep -F 'INTERACTION_SMOKE_OK' /tmp/interaction-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|INTERACTION_SMOKE_FAIL" /tmp/interaction-smoke.log; then exit 1; fi

      - name: Run v0.3.11 spatial connector smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/spatial_connectors_smoke_v041.gd 2>&1 | tee /tmp/spatial-smoke.log
          grep -F 'SPATIAL_SMOKE_OK' /tmp/spatial-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|SPATIAL_SMOKE_FAIL" /tmp/spatial-smoke.log; then exit 1; fi

      - name: Run v0.4.0 editor UX smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/editor_ux_smoke_v042.gd 2>&1 | tee /tmp/editor-ux-smoke.log
          grep -F 'EDITOR_UX_SMOKE_OK' /tmp/editor-ux-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_UX_SMOKE_FAIL" /tmp/editor-ux-smoke.log; then exit 1; fi

      - name: Run v0.5.0 editor chunk 2 smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/editor_chunk2_smoke_v050.gd 2>&1 | tee /tmp/chunk2-smoke.log
          grep -F 'CHUNK2_SMOKE_OK' /tmp/chunk2-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|CHUNK2_SMOKE_FAIL" /tmp/chunk2-smoke.log; then exit 1; fi

      - name: Run v0.5.1 editor correctness smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/editor_correctness_smoke_v051.gd 2>&1 | tee /tmp/editor-051-smoke.log
          grep -F 'EDITOR_051_SMOKE_OK' /tmp/editor-051-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_051_SMOKE_FAIL" /tmp/editor-051-smoke.log; then exit 1; fi

      - name: Run v0.5.2 interaction reliability smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/editor_reliability_smoke_v052.gd 2>&1 | tee /tmp/editor-052-smoke.log
          grep -F 'EDITOR_052_SMOKE_OK' /tmp/editor-052-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_052_SMOKE_FAIL" /tmp/editor-052-smoke.log; then exit 1; fi

      - name: Run v0.5.3 touch attachment smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/editor_touch_attach_smoke_v053.gd 2>&1 | tee /tmp/editor-053-smoke.log
          grep -F 'EDITOR_053_SMOKE_OK' /tmp/editor-053-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_053_SMOKE_FAIL" /tmp/editor-053-smoke.log; then exit 1; fi

      - name: Run v0.5.4 auto-attach selection smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/editor_autoattach_selection_smoke_v054.gd 2>&1 | tee /tmp/editor-054-smoke.log
          grep -F 'EDITOR_054_SMOKE_OK' /tmp/editor-054-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_054_SMOKE_FAIL" /tmp/editor-054-smoke.log; then exit 1; fi

      - name: Run superseded v0.5.5 geometry regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/editor_geometry_snap_smoke_v055.gd 2>&1 | tee /tmp/editor-055-smoke.log
          grep -F 'EDITOR_055_SMOKE_OK' /tmp/editor-055-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_055_SMOKE_FAIL" /tmp/editor-055-smoke.log; then exit 1; fi

      - name: Run v0.5.6 axle/camera compatibility smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/editor_autodock_camera_smoke_v056.gd 2>&1 | tee /tmp/editor-056-smoke.log
          grep -F 'EDITOR_056_SMOKE_OK' /tmp/editor-056-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_056_SMOKE_FAIL" /tmp/editor-056-smoke.log; then exit 1; fi

      - name: Run v0.5.7 immediate rod far-end auto-attach smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/rod_far_end_autoattach_smoke_v057.gd 2>&1 | tee /tmp/editor-057-smoke.log
          grep -F 'EDITOR_057_SMOKE_OK' /tmp/editor-057-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_057_SMOKE_FAIL" /tmp/editor-057-smoke.log; then exit 1; fi

      - name: Run v0.5.8 closed-loop socket simulation smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/socket_loop_simulation_smoke_v058.gd 2>&1 | tee /tmp/editor-058-smoke.log
          grep -F 'EDITOR_058_SMOKE_OK' /tmp/editor-058-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_058_SMOKE_FAIL" /tmp/editor-058-smoke.log; then exit 1; fi

      - name: Run v0.5.9 deterministic camera gesture smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/camera_gesture_smoke_v059.gd 2>&1 | tee /tmp/camera-059-smoke.log
          grep -F 'CAMERA_059_SMOKE_OK' /tmp/camera-059-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|CAMERA_059_SMOKE_FAIL" /tmp/camera-059-smoke.log; then exit 1; fi

      - name: Run v0.5.9 long physics stability smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/physics_stability_smoke_v059.gd 2>&1 | tee /tmp/physics-059-smoke.log
          grep -F 'PHYSICS_059_SMOKE_OK' /tmp/physics-059-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|PHYSICS_059_SMOKE_FAIL" /tmp/physics-059-smoke.log; then exit 1; fi

      - name: Run v0.5.10 strict auto-connect and no-warp smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/strict_autoconnect_no_warp_smoke_v510.gd 2>&1 | tee /tmp/strict-510-smoke.log
          grep -F 'STRICT_510_SMOKE_OK' /tmp/strict-510-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|STRICT_510_SMOKE_FAIL" /tmp/strict-510-smoke.log; then exit 1; fi

      - name: Export Android APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          if [[ "${{ github.event_name }}" == "push" && "${{ contains(github.event.head_commit.message, '[release]') }}" == "true" ]]; then
            godot --headless --path . --export-release "Android" "build/${APK_NAME}"
          else
            godot --headless --path . --export-debug "Android" "build/${APK_NAME}"
          fi
          test -s "build/${APK_NAME}"
          sha256sum "build/${APK_NAME}" > "build/${APK_NAME}.sha256"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.1/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "build/${APK_NAME}" | tee "build/${APK_NAME}.signing.txt"
          if [[ "${{ github.event_name }}" == "push" && "${{ contains(github.event.head_commit.message, '[release]') }}" == "true" ]]; then
            grep -F "Signer #1 certificate SHA-256 digest: $(echo "$EXPECTED_RELEASE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')" "build/${APK_NAME}.signing.txt"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            build/${{ env.APK_NAME }}
            build/${{ env.APK_NAME }}.sha256
            build/${{ env.APK_NAME }}.signing.txt
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v5

      - name: Download validated APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build

      - name: Publish GitHub Release v0.5.10
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.10
          name: Connex Lab v0.5.10
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            build/${{ env.APK_NAME }}
            build/${{ env.APK_NAME }}.sha256
