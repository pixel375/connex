name: Android APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.3
  GODOT_TAG: 4.6.3-stable
  APP_VERSION: 0.5.21
  APP_VERSION_CODE: 45
  APK_NAME: Connex-v0.5.21.apk
  ARTIFACT_NAME: Connex-Android-v0.5.21
  EXPECTED_RELEASE_CERT_SHA256: BF:CD:2B:59:70:91:E4:AA:FE:4F:27:93:FD:14:A7:9A:2A:D4:94:0D:D1:06:9D:18:74:9C:E7:A9:99:50:D4:22

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify version, package and signing metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'res://scripts/main_v080.gd' Main.tscn
          grep -F 'const VERSION_080 := "0.5.21"' scripts/main_v080.gd
          grep -F 'boot_splash/show_image=false' project.godot
          grep -F '3d/physics_engine="JoltPhysics3D"' project.godot
          grep -F 'export_path="build/Connex-v0.5.21.apk"' export_presets.cfg
          grep -F 'version/code=45' export_presets.cfg
          grep -F 'version/name="0.5.21"' export_presets.cfg
          grep -F 'package/unique_name="com.pixel375.connex"' export_presets.cfg
          grep -F "\`$EXPECTED_RELEASE_CERT_SHA256\`" SIGNING.md

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.1" "platforms;android-35"

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          mkdir -p /tmp/godot /tmp/godot-templates
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          chmod +x "$GODOT_BIN"
          sudo install -m 0755 "$GODOT_BIN" /usr/local/bin/godot
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          godot --version
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

      - name: Configure Android debug export
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Connex,C=CA"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          EOF

      - name: Prepare permanent release signing key
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        shell: bash
        env:
          CONNEX_KEYSTORE_B64: ${{ secrets.CONNEX_KEYSTORE_B64 }}
          CONNEX_KEYSTORE_PASSWORD: ${{ secrets.CONNEX_KEYSTORE_PASSWORD }}
          CONNEX_KEY_ALIAS: ${{ secrets.CONNEX_KEY_ALIAS }}
          CONNEX_KEY_PASSWORD: ${{ secrets.CONNEX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in CONNEX_KEYSTORE_B64 CONNEX_KEYSTORE_PASSWORD CONNEX_KEY_ALIAS CONNEX_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${secret_name}"
              exit 1
            fi
          done
          if [[ "$CONNEX_KEYSTORE_PASSWORD" != "$CONNEX_KEY_PASSWORD" ]]; then
            echo "::error::Godot Android export requires the keystore and key passwords to match."
            exit 1
          fi
          printf '%s' "$CONNEX_KEYSTORE_B64" | base64 --decode > /tmp/connex-release.keystore
          chmod 600 /tmp/connex-release.keystore
          keytool -list -keystore /tmp/connex-release.keystore -storepass "$CONNEX_KEYSTORE_PASSWORD" -alias "$CONNEX_KEY_ALIAS" >/dev/null
          CERT_SHA256="$(keytool -list -v -keystore /tmp/connex-release.keystore -storepass "$CONNEX_KEYSTORE_PASSWORD" -alias "$CONNEX_KEY_ALIAS" | awk '/SHA256:/{print $2; exit}')"
          if [[ "$CERT_SHA256" != "$EXPECTED_RELEASE_CERT_SHA256" ]]; then
            echo "::error::Release signing certificate mismatch. Expected $EXPECTED_RELEASE_CERT_SHA256 but got $CERT_SHA256"
            exit 1
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/connex-release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$CONNEX_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$CONNEX_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Prepare descendant-runtime smoke tests
        shell: bash
        run: |
          set -euo pipefail
          sed -Ei 's/main_v[0-9]+\.gd/main_v080.gd/g' \
            tests/editor_chunk2_smoke_v050.gd \
            tests/editor_correctness_smoke_v051.gd \
            tests/o_ring_mixed_stability_smoke_v063.gd \
            tests/axle_o_ring_video_stability_smoke_v064.gd \
            tests/editor_socket_workflows_smoke_v070.gd \
            tests/axle_cross_stop_roundtrip_smoke_v072.gd \
            tests/legacy_axle_corrupt_save_repair_smoke_v074.gd \
            tests/cross_socket_midpoint_slide_smoke_v074.gd \
            tests/attach_pick_undo_spatial_cross_smoke_v075.gd \
            tests/attach_selection_oring_overlay_reconnect_smoke_v076.gd || true
          sed -Ei 's/ends_with\("main_v[0-9]+\.gd"\)/ends_with("main_v080.gd")/g' \
            tests/editor_reliability_smoke_v052.gd \
            tests/editor_touch_attach_smoke_v053.gd \
            tests/editor_autoattach_selection_smoke_v054.gd \
            tests/editor_geometry_snap_smoke_v055.gd \
            tests/editor_autodock_camera_smoke_v056.gd \
            tests/rod_far_end_autoattach_smoke_v057.gd \
            tests/socket_loop_simulation_smoke_v058.gd \
            tests/camera_gesture_smoke_v059.gd \
            tests/physics_stability_smoke_v059.gd \
            tests/strict_autoconnect_no_warp_smoke_v510.gd \
            tests/structure_rigidity_smoke_v061.gd \
            tests/rigidity_live_axle_smoke_v062.gd || true
          # v0.5.21 deliberately retires both old XYZ side panels. Keep the
          # historical reliability test for everything else, but adapt only the
          # two assertions that required the superseded panel layout.
          sed -i 's/if not rotation_panel.visible or move_panel.visible:/if rotation_panel.visible or move_panel.visible:/' tests/editor_reliability_smoke_v052.gd
          sed -i 's/if rotation_panel.visible or not move_panel.visible:/if rotation_panel.visible or move_panel.visible:/' tests/editor_reliability_smoke_v052.gd

      - name: Parse project and smoke-test main scene
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot-editor.log
          if grep -Eq "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-editor.log; then exit 1; fi
          godot --headless --path . --quit-after 2 2>&1 | tee /tmp/godot-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-smoke.log; then exit 1; fi

      - name: Run complete regression suite through v0.5.21
        shell: bash
        run: |
          set -euo pipefail
          run_smoke() {
            local script="$1"
            local marker="$2"
            local fail_pattern="$3"
            local slug="$4"
            godot --headless --path . --script "res://tests/${script}" 2>&1 | tee "/tmp/${slug}.log"
            grep -F "$marker" "/tmp/${slug}.log"
            if grep -Eq "SCRIPT ERROR|Parse Error|${fail_pattern}" "/tmp/${slug}.log"; then exit 1; fi
          }
          run_smoke audit_smoke_v038.gd AUDIT_SMOKE_OK AUDIT_SMOKE_FAIL audit
          run_smoke selection_smoke_v039.gd SELECTION_SMOKE_OK SELECTION_SMOKE_FAIL selection
          run_smoke interaction_smoke_v040.gd INTERACTION_SMOKE_OK INTERACTION_SMOKE_FAIL interaction
          run_smoke spatial_connectors_smoke_v041.gd SPATIAL_SMOKE_OK SPATIAL_SMOKE_FAIL spatial
          run_smoke editor_ux_smoke_v042.gd EDITOR_UX_SMOKE_OK EDITOR_UX_SMOKE_FAIL editor-ux
          run_smoke editor_chunk2_smoke_v050.gd CHUNK2_SMOKE_OK CHUNK2_SMOKE_FAIL chunk2
          run_smoke editor_correctness_smoke_v051.gd EDITOR_051_SMOKE_OK EDITOR_051_SMOKE_FAIL editor-051
          run_smoke editor_reliability_smoke_v052.gd EDITOR_052_SMOKE_OK EDITOR_052_SMOKE_FAIL editor-052
          run_smoke editor_touch_attach_smoke_v053.gd EDITOR_053_SMOKE_OK EDITOR_053_SMOKE_FAIL editor-053
          run_smoke editor_autoattach_selection_smoke_v054.gd EDITOR_054_SMOKE_OK EDITOR_054_SMOKE_FAIL editor-054
          run_smoke editor_geometry_snap_smoke_v055.gd EDITOR_055_SMOKE_OK EDITOR_055_SMOKE_FAIL editor-055
          run_smoke editor_autodock_camera_smoke_v056.gd EDITOR_056_SMOKE_OK EDITOR_056_SMOKE_FAIL editor-056
          run_smoke rod_far_end_autoattach_smoke_v057.gd EDITOR_057_SMOKE_OK EDITOR_057_SMOKE_FAIL rod-far-end-057
          run_smoke socket_loop_simulation_smoke_v058.gd EDITOR_058_SMOKE_OK EDITOR_058_SMOKE_FAIL socket-loop-058
          run_smoke camera_gesture_smoke_v059.gd CAMERA_059_SMOKE_OK CAMERA_059_SMOKE_FAIL camera-059
          run_smoke physics_stability_smoke_v059.gd PHYSICS_059_SMOKE_OK PHYSICS_059_SMOKE_FAIL physics-059
          run_smoke strict_autoconnect_no_warp_smoke_v510.gd STRICT_510_SMOKE_OK STRICT_510_SMOKE_FAIL strict-510
          run_smoke structure_rigidity_smoke_v061.gd RIGIDITY_061_SMOKE_OK RIGIDITY_061_SMOKE_FAIL rigidity-061
          run_smoke rigidity_live_axle_smoke_v062.gd RIGIDITY_AXLE_062_SMOKE_OK RIGIDITY_AXLE_062_SMOKE_FAIL rigidity-axle-062
          run_smoke o_ring_mixed_stability_smoke_v063.gd ORING_STABILITY_063_SMOKE_OK ORING_STABILITY_063_SMOKE_FAIL oring-stability-063
          run_smoke axle_o_ring_video_stability_smoke_v064.gd AXLE_ORING_VIDEO_064_SMOKE_OK AXLE_ORING_VIDEO_064_SMOKE_FAIL axle-oring-video-064
          run_smoke editor_socket_workflows_smoke_v070.gd EDITOR_SOCKET_070_SMOKE_OK EDITOR_SOCKET_070_SMOKE_FAIL editor-socket-070
          run_smoke axle_cross_stop_roundtrip_smoke_v072.gd AXLE_CROSS_ROUNDTRIP_072_SMOKE_OK AXLE_CROSS_ROUNDTRIP_072_SMOKE_FAIL axle-cross-roundtrip-072
          run_smoke legacy_axle_corrupt_save_repair_smoke_v074.gd LEGACY_AXLE_REPAIR_074_SMOKE_OK LEGACY_AXLE_REPAIR_074_SMOKE_FAIL legacy-axle-repair-074
          run_smoke cross_socket_midpoint_slide_smoke_v074.gd CROSS_SOCKET_SLIDE_074_SMOKE_OK CROSS_SOCKET_SLIDE_074_SMOKE_FAIL cross-socket-slide-074
          run_smoke attach_pick_undo_spatial_cross_smoke_v075.gd ATTACH_UNDO_SPATIAL_CROSS_075_SMOKE_OK ATTACH_UNDO_SPATIAL_CROSS_075_SMOKE_FAIL editor-fixes-075
          run_smoke attach_selection_oring_overlay_reconnect_smoke_v076.gd EDITOR_076_SMOKE_OK EDITOR_076_SMOKE_FAIL editor-reconnect-076
          run_smoke camera_transform_ui_smoke_v078.gd CAMERA_TRANSFORM_078_SMOKE_OK CAMERA_TRANSFORM_078_SMOKE_FAIL camera-transform-078

      - name: Export Android APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          if [[ "${{ github.event_name }}" == "push" && "${{ contains(github.event.head_commit.message, '[release]') }}" == "true" ]]; then
            godot --headless --path . --export-release "Android" "build/${APK_NAME}"
          else
            godot --headless --path . --export-debug "Android" "build/${APK_NAME}"
          fi
          test -s "build/${APK_NAME}"
          sha256sum "build/${APK_NAME}" > "build/${APK_NAME}.sha256"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.1/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "build/${APK_NAME}" | tee "build/${APK_NAME}.signing.txt"
          if [[ "${{ github.event_name }}" == "push" && "${{ contains(github.event.head_commit.message, '[release]') }}" == "true" ]]; then
            grep -F "Signer #1 certificate SHA-256 digest: $(echo "$EXPECTED_RELEASE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')" "build/${APK_NAME}.signing.txt"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            build/${{ env.APK_NAME }}
            build/${{ env.APK_NAME }}.sha256
            build/${{ env.APK_NAME }}.signing.txt
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v5

      - name: Download validated APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build

      - name: Publish GitHub Release v0.5.21
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.21
          name: Connex Lab v0.5.21
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            build/${{ env.APK_NAME }}
            build/${{ env.APK_NAME }}.sha256