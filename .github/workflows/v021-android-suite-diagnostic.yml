name: v0.5.21 Android Suite Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot 4.6.3
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip"
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          chmod +x "$GODOT_BIN"
          sudo install -m 0755 "$GODOT_BIN" /usr/local/bin/godot
      - name: Patch descendant tests to current runtime
        shell: bash
        run: |
          set -euo pipefail
          sed -Ei 's/main_v[0-9]+\.gd/main_v080.gd/g' tests/editor_chunk2_smoke_v050.gd tests/editor_correctness_smoke_v051.gd || true
      - name: Run early Android suite tests with hard per-test timeout
        shell: bash
        run: |
          set -euo pipefail
          run_one() {
            local script="$1" marker="$2"
            echo "=== START ${script} ==="
            timeout 35s godot --headless --path . --script "res://tests/${script}" 2>&1 | tee "/tmp/${script}.log"
            grep -F "$marker" "/tmp/${script}.log"
            echo "=== PASS ${script} ==="
          }
          run_one audit_smoke_v038.gd AUDIT_SMOKE_OK
          run_one selection_smoke_v039.gd SELECTION_SMOKE_OK
          run_one interaction_smoke_v040.gd INTERACTION_SMOKE_OK
          run_one spatial_connectors_smoke_v041.gd SPATIAL_SMOKE_OK
          run_one editor_ux_smoke_v042.gd EDITOR_UX_SMOKE_OK
          run_one editor_chunk2_smoke_v050.gd CHUNK2_SMOKE_OK
          run_one editor_correctness_smoke_v051.gd EDITOR_051_SMOKE_OK