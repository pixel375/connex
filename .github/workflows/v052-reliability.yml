name: v0.5.7 Regression Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot 4.6.3
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip"
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          chmod +x "$GODOT_BIN"
          sudo install -m 0755 "$GODOT_BIN" /usr/local/bin/godot
          godot --version

      - name: Parse project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot-editor.log
          if grep -Eq "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-editor.log; then exit 1; fi

      - name: Prepare descendant-runtime smoke tests
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/ends_with("main_v054.gd")/ends_with("main_v062.gd")/' tests/editor_reliability_smoke_v052.gd
          sed -i 's/ends_with("main_v056.gd")/ends_with("main_v062.gd")/' tests/editor_touch_attach_smoke_v053.gd
          sed -i 's/ends_with("main_v057.gd")/ends_with("main_v062.gd")/' tests/editor_touch_attach_smoke_v053.gd || true
          sed -i 's/ends_with("main_v058.gd")/ends_with("main_v062.gd")/' tests/editor_autoattach_selection_smoke_v054.gd || true
          sed -i 's/ends_with("main_v059.gd")/ends_with("main_v062.gd")/' tests/editor_geometry_snap_smoke_v055.gd || true
          sed -i 's/ends_with("main_v060.gd")/ends_with("main_v062.gd")/' tests/editor_geometry_snap_smoke_v055.gd || true
          sed -i 's/ends_with("main_v061.gd")/ends_with("main_v062.gd")/' tests/editor_geometry_snap_smoke_v055.gd || true
          sed -i 's/ends_with("main_v061.gd")/ends_with("main_v062.gd")/' tests/editor_autodock_camera_smoke_v056.gd || true
          sed -i 's/deg_to_rad(8\.0)/deg_to_rad(4.0)/' tests/editor_geometry_snap_smoke_v055.gd

      - name: Run v0.5.2 interaction reliability smoke on v0.5.7 runtime
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/editor_reliability_smoke_v052.gd 2>&1 | tee /tmp/editor-052-smoke.log
          grep -F 'EDITOR_052_SMOKE_OK' /tmp/editor-052-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_052_SMOKE_FAIL" /tmp/editor-052-smoke.log; then exit 1; fi

      - name: Run v0.5.3 touch attachment smoke on v0.5.7 runtime
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/editor_touch_attach_smoke_v053.gd 2>&1 | tee /tmp/editor-053-smoke.log
          grep -F 'EDITOR_053_SMOKE_OK' /tmp/editor-053-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_053_SMOKE_FAIL" /tmp/editor-053-smoke.log; then exit 1; fi

      - name: Run v0.5.4 auto-attach selection smoke on v0.5.7 runtime
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/editor_autoattach_selection_smoke_v054.gd 2>&1 | tee /tmp/editor-054-smoke.log
          grep -F 'EDITOR_054_SMOKE_OK' /tmp/editor-054-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_054_SMOKE_FAIL" /tmp/editor-054-smoke.log; then exit 1; fi

      - name: Run v0.5.5 geometry snap smoke on v0.5.7 runtime
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/editor_geometry_snap_smoke_v055.gd 2>&1 | tee /tmp/editor-055-smoke.log
          grep -F 'EDITOR_055_SMOKE_OK' /tmp/editor-055-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_055_SMOKE_FAIL" /tmp/editor-055-smoke.log; then exit 1; fi

      - name: Run v0.5.6 axle auto-dock and camera smoke on v0.5.7 runtime
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/editor_autodock_camera_smoke_v056.gd 2>&1 | tee /tmp/editor-056-smoke.log
          grep -F 'EDITOR_056_SMOKE_OK' /tmp/editor-056-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_056_SMOKE_FAIL" /tmp/editor-056-smoke.log; then exit 1; fi

      - name: Run v0.5.7 immediate rod far-end auto-attach smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/rod_far_end_autoattach_smoke_v057.gd 2>&1 | tee /tmp/editor-057-smoke.log
          grep -F 'EDITOR_057_SMOKE_OK' /tmp/editor-057-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_057_SMOKE_FAIL" /tmp/editor-057-smoke.log; then exit 1; fi
