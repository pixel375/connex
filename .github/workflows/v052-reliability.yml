name: v0.5.16 Regression Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot 4.6.3
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip"
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          chmod +x "$GODOT_BIN"
          sudo install -m 0755 "$GODOT_BIN" /usr/local/bin/godot
          godot --version

      - name: Parse project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot-editor.log
          if grep -Eq "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-editor.log; then exit 1; fi

      - name: Prepare descendant-runtime smoke tests
        shell: bash
        run: |
          set -euo pipefail
          sed -Ei 's/ends_with\("main_v[0-9]+\.gd"\)/ends_with("main_v075.gd")/g' \
            tests/editor_reliability_smoke_v052.gd \
            tests/editor_touch_attach_smoke_v053.gd \
            tests/editor_autoattach_selection_smoke_v054.gd \
            tests/editor_geometry_snap_smoke_v055.gd \
            tests/editor_autodock_camera_smoke_v056.gd \
            tests/rod_far_end_autoattach_smoke_v057.gd \
            tests/socket_loop_simulation_smoke_v058.gd \
            tests/camera_gesture_smoke_v059.gd \
            tests/physics_stability_smoke_v059.gd \
            tests/strict_autoconnect_no_warp_smoke_v510.gd \
            tests/structure_rigidity_smoke_v061.gd \
            tests/rigidity_live_axle_smoke_v062.gd \
            tests/followup_regression_smoke_v074.gd || true
          sed -Ei 's/main_v(069|070|071|072|073|074)\.gd/main_v075.gd/g' \
            tests/o_ring_mixed_stability_smoke_v063.gd \
            tests/axle_o_ring_video_stability_smoke_v064.gd \
            tests/editor_socket_workflows_smoke_v070.gd || true

      - name: Run complete regression suite through v0.5.16
        shell: bash
        run: |
          set -euo pipefail
          run_smoke() {
            local script="$1" marker="$2" fail="$3" slug="$4"
            godot --headless --path . --script "res://tests/${script}" 2>&1 | tee "/tmp/${slug}.log"
            grep -F "$marker" "/tmp/${slug}.log"
            if grep -Eq "SCRIPT ERROR|Parse Error|${fail}" "/tmp/${slug}.log"; then exit 1; fi
          }
          run_smoke editor_reliability_smoke_v052.gd EDITOR_052_SMOKE_OK EDITOR_052_SMOKE_FAIL editor-052
          run_smoke editor_touch_attach_smoke_v053.gd EDITOR_053_SMOKE_OK EDITOR_053_SMOKE_FAIL editor-053
          run_smoke editor_autoattach_selection_smoke_v054.gd EDITOR_054_SMOKE_OK EDITOR_054_SMOKE_FAIL editor-054
          run_smoke editor_geometry_snap_smoke_v055.gd EDITOR_055_SMOKE_OK EDITOR_055_SMOKE_FAIL editor-055
          run_smoke editor_autodock_camera_smoke_v056.gd EDITOR_056_SMOKE_OK EDITOR_056_SMOKE_FAIL editor-056
          run_smoke rod_far_end_autoattach_smoke_v057.gd EDITOR_057_SMOKE_OK EDITOR_057_SMOKE_FAIL editor-057
          run_smoke socket_loop_simulation_smoke_v058.gd EDITOR_058_SMOKE_OK EDITOR_058_SMOKE_FAIL editor-058
          run_smoke camera_gesture_smoke_v059.gd CAMERA_059_SMOKE_OK CAMERA_059_SMOKE_FAIL camera-059
          run_smoke physics_stability_smoke_v059.gd PHYSICS_059_SMOKE_OK PHYSICS_059_SMOKE_FAIL physics-059
          run_smoke strict_autoconnect_no_warp_smoke_v510.gd STRICT_510_SMOKE_OK STRICT_510_SMOKE_FAIL strict-510
          run_smoke structure_rigidity_smoke_v061.gd RIGIDITY_061_SMOKE_OK RIGIDITY_061_SMOKE_FAIL rigidity-061
          run_smoke rigidity_live_axle_smoke_v062.gd RIGIDITY_AXLE_062_SMOKE_OK RIGIDITY_AXLE_062_SMOKE_FAIL rigidity-axle-062
          run_smoke o_ring_pair_diagnostic_v074.gd ORING_PAIR_DIAG_074_OK ORING_PAIR_DIAG_074_FAIL oring-pair-diag-074
          run_smoke o_ring_mixed_stability_smoke_v063.gd ORING_STABILITY_063_SMOKE_OK ORING_STABILITY_063_SMOKE_FAIL oring-063
          run_smoke axle_o_ring_video_stability_smoke_v064.gd AXLE_ORING_VIDEO_064_SMOKE_OK AXLE_ORING_VIDEO_064_SMOKE_FAIL oring-video-064
          run_smoke editor_socket_workflows_smoke_v070.gd EDITOR_SOCKET_070_SMOKE_OK EDITOR_SOCKET_070_SMOKE_FAIL socket-070
          run_smoke followup_regression_smoke_v074.gd FOLLOWUP_074_SMOKE_OK FOLLOWUP_074_SMOKE_FAIL followup-074
