name: v0.5.12 Regression Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot 4.6.3
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip"
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          chmod +x "$GODOT_BIN"
          sudo install -m 0755 "$GODOT_BIN" /usr/local/bin/godot
          godot --version

      - name: Parse project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot-editor.log
          if grep -Eq "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-editor.log; then exit 1; fi

      - name: Prepare descendant-runtime smoke tests
        shell: bash
        run: |
          set -euo pipefail
          sed -Ei 's/ends_with\("main_v[0-9]+\.gd"\)/ends_with("main_v067.gd")/g' \
            tests/editor_reliability_smoke_v052.gd \
            tests/editor_touch_attach_smoke_v053.gd \
            tests/editor_autoattach_selection_smoke_v054.gd \
            tests/editor_geometry_snap_smoke_v055.gd \
            tests/editor_autodock_camera_smoke_v056.gd \
            tests/rod_far_end_autoattach_smoke_v057.gd \
            tests/socket_loop_simulation_smoke_v058.gd \
            tests/camera_gesture_smoke_v059.gd \
            tests/strict_autoconnect_no_warp_smoke_v510.gd \
            tests/structure_rigidity_smoke_v061.gd || true

      - name: Run v0.5.2 interaction reliability smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/editor_reliability_smoke_v052.gd 2>&1 | tee /tmp/editor-052-smoke.log
          grep -F 'EDITOR_052_SMOKE_OK' /tmp/editor-052-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_052_SMOKE_FAIL" /tmp/editor-052-smoke.log; then exit 1; fi

      - name: Run v0.5.3 touch attachment smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/editor_touch_attach_smoke_v053.gd 2>&1 | tee /tmp/editor-053-smoke.log
          grep -F 'EDITOR_053_SMOKE_OK' /tmp/editor-053-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_053_SMOKE_FAIL" /tmp/editor-053-smoke.log; then exit 1; fi

      - name: Run v0.5.4 auto-attach selection smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/editor_autoattach_selection_smoke_v054.gd 2>&1 | tee /tmp/editor-054-smoke.log
          grep -F 'EDITOR_054_SMOKE_OK' /tmp/editor-054-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_054_SMOKE_FAIL" /tmp/editor-054-smoke.log; then exit 1; fi

      - name: Run superseded v0.5.5 geometry regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/editor_geometry_snap_smoke_v055.gd 2>&1 | tee /tmp/editor-055-smoke.log
          grep -F 'EDITOR_055_SMOKE_OK' /tmp/editor-055-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_055_SMOKE_FAIL" /tmp/editor-055-smoke.log; then exit 1; fi

      - name: Run v0.5.6 axle/camera compatibility smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/editor_autodock_camera_smoke_v056.gd 2>&1 | tee /tmp/editor-056-smoke.log
          grep -F 'EDITOR_056_SMOKE_OK' /tmp/editor-056-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_056_SMOKE_FAIL" /tmp/editor-056-smoke.log; then exit 1; fi

      - name: Run v0.5.7 immediate rod far-end auto-attach smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/rod_far_end_autoattach_smoke_v057.gd 2>&1 | tee /tmp/editor-057-smoke.log
          grep -F 'EDITOR_057_SMOKE_OK' /tmp/editor-057-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_057_SMOKE_FAIL" /tmp/editor-057-smoke.log; then exit 1; fi

      - name: Run v0.5.8 closed-loop socket simulation smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/socket_loop_simulation_smoke_v058.gd 2>&1 | tee /tmp/editor-058-smoke.log
          grep -F 'EDITOR_058_SMOKE_OK' /tmp/editor-058-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|EDITOR_058_SMOKE_FAIL" /tmp/editor-058-smoke.log; then exit 1; fi

      - name: Run v0.5.9 deterministic camera gesture smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/camera_gesture_smoke_v059.gd 2>&1 | tee /tmp/camera-059-smoke.log
          grep -F 'CAMERA_059_SMOKE_OK' /tmp/camera-059-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|CAMERA_059_SMOKE_FAIL" /tmp/camera-059-smoke.log; then exit 1; fi

      - name: Run v0.5.9 long physics stability smoke on current runtime
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/physics_stability_smoke_v059.gd 2>&1 | tee /tmp/physics-059-smoke.log
          grep -F 'PHYSICS_059_SMOKE_OK' /tmp/physics-059-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|PHYSICS_059_SMOKE_FAIL" /tmp/physics-059-smoke.log; then exit 1; fi

      - name: Run v0.5.10 strict auto-connect and no-warp smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/strict_autoconnect_no_warp_smoke_v510.gd 2>&1 | tee /tmp/strict-510-smoke.log
          grep -F 'STRICT_510_SMOKE_OK' /tmp/strict-510-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|STRICT_510_SMOKE_FAIL" /tmp/strict-510-smoke.log; then exit 1; fi

      - name: Run v0.5.11 structure rigidity smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/structure_rigidity_smoke_v061.gd 2>&1 | tee /tmp/rigidity-061-smoke.log
          grep -F 'RIGIDITY_061_SMOKE_OK' /tmp/rigidity-061-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|RIGIDITY_061_SMOKE_FAIL" /tmp/rigidity-061-smoke.log; then exit 1; fi

      - name: Run v0.5.12 live rigidity and axle gravity smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/rigidity_live_axle_smoke_v062.gd 2>&1 | tee /tmp/rigidity-axle-062-smoke.log
          grep -F 'RIGIDITY_AXLE_062_SMOKE_OK' /tmp/rigidity-axle-062-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|RIGIDITY_AXLE_062_SMOKE_FAIL" /tmp/rigidity-axle-062-smoke.log; then exit 1; fi
